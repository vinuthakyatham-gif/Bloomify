<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
</head>

<body style="font-family:Arial;background:#fff8fb;">

<div style="width:400px;margin:auto;margin-top:50px;background:white;padding:20px;border-radius:15px;box-shadow:0px 0px 10px lightgray;">

<h2 align="center">✏️ Edit Profile</h2>

<form method="POST">

<label>Name</label><br>
<input type="text"
name="name"
value="{{ name }}"
style="width:100%;padding:10px;"><br><br>

<label>Email</label><br>
<input type="email"
name="email"
value="{{ email }}"
style="width:100%;padding:10px;"><br><br>

<button type="submit">
💾 Save Changes
</button>

<a href="/profile">
<button type="button">
❌ Cancel
</button>
</a>

</form>

</div>

</body>
</html>
